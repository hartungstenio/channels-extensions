[project]
name = "channels-extensions"
description = "Some extensions for Django Channels."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
  { name = "Christian Hartung", email = "6785871+hartungstenio@users.noreply.github.com" },
]
keywords = ["django"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "asgiref",
  "asyncio-extensions",
  "channels",
  "django>=5.2",
  "typing-extensions; python_version < '3.12'",
]
dynamic = ["version"]

[project.optional-dependencies]
orjson = ["django-orjson", "orjson"]

[project.urls]
Documentation = "https://github.com/hartungstenio/channels-extensions#readme"
Issues = "https://github.com/hartungstenio/channels-extensions/issues"
Source = "https://github.com/hartungstenio/channels-extensions"

[dependency-groups]
dev = [
  "coverage[toml]>=6.5",
  "deptry",
  "faker",
  "pre-commit",
  "pytest",
  "pytest-asyncio",
  "pytest-django",
  "ruff",
  { include-group = "types" },
]
types = [
  "django-stubs-ext>=5.2",
  "django-stubs>=5.2",
  "mypy",
  "pyrefly",
  "types-channels",
]

[build-system]
requires = ["hatch-vcs", "hatchling"]
build-backend = "hatchling.build"

[tool.coverage.run]
source_pkgs = ["channels_extensions", "tests"]
branch = true
parallel = true

[tool.coverage.paths]
channels_extensions = [
  "src/channels_extensions",
  "*/channels-extensions/src/channels_extensions"
]
tests = ["tests", "*/channels-extensions/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.deptry]
known_first_party = ["channels_extensions"]

[tool.django-stubs]
django_settings_module = "testproj.settings"

[tool.hatch.build.targets.wheel]
sources = ["src"]

[tool.hatch.build.targets.sdist]
exclude = ["/.devcontainer", "/.github"]

[tool.hatch.version]
source = "vcs"

[tool.hatch]
requires-hatch = ">=1.18.0"

[tool.hatch.envs.default]
features = ["orjson"]
dependency-groups = ["dev"]

[tool.hatch.envs.hatch-check-types]
features = ["orjson"]
dependency-groups = ["types"]

[tool.hatch.envs.hatch-check-types.scripts]
check = [
  "pyrefly check{env:HATCH_CHECK_TYPES_ARGS:} {args}",
  "mypy {args}",
]

[tool.hatch.envs.hatch-test]
features = ["orjson"]
dependency-groups = ["dev"]

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.11", "3.12", "3.13", "3.14", "3.15"]

[[tool.hatch.envs.hatch-test.matrix]]
django = ["5.2"]
python = ["3.11", "3.12", "3.13", "3.14"]

[[tool.hatch.envs.hatch-test.matrix]]
django = ["6.0"]
python = ["3.12", "3.13", "3.14"]

[[tool.hatch.envs.hatch-test.matrix]]
django = ["6.1"]
python = ["3.12", "3.13", "3.14", "3.15"]

[tool.hatch.envs.hatch-test.overrides]
matrix.django.dependencies = [
  { value = "django>=5.2,<6.0", if = ["5.2"] },
  { value = "django>=6.0,<6.1", if = ["6.0"] },
  { value = "django>=6.1,<6.2", if = ["6.1"] },
]

[tool.hatch.envs.hatch-check-code]
dependencies = ["ruff"]

[tool.hatch.envs.hatch-check-fmt]
dependencies = ["ruff"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["mypy_django_plugin.main"]
enable_error_code = ["deprecated"]

[tool.pyrefly]
project-includes = ["src"]
preset = "strict"
min-severity = "ignore"

[tool.pytest]
pythonpath = [".", "src"]
DJANGO_SETTINGS_MODULE = "testproj.settings"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
  "ERA",
  "YTT",
  "ANN",
  "ASYNC",
  "S",
  "BLE",
  "FBT",
  "B",
  "A",
  "COM",
  "C4",
  "DTZ",
  "T10",
  "DJ",
  "EM",
  "EXE",
  "FIX",
  "FA",
  "INT",
  "ISC",
  "ICN",
  "LOG",
  "G",
  "INP",
  "PIE",
  "T20",
  "PT",
  "Q",
  "RSE",
  "RET",
  "SLF",
  "SIM",
  "SLOT",
  "TID",
  "TD",
  "TC",
  "ARG",
  "PTH",
  "FLY",
  "I",
  "C90",
  "N",
  "PERF",
  "E",
  "W",
  "D",
  "F",
  "PGH",
  "PL",
  "UP",
  "FURB",
  "RUF",
  "TRY",
]
ignore = ["COM812", "SIM105"]
typing-modules = ["channels_extensions._compat"]

[tool.ruff.lint.extend-per-file-ignores]
"*/migrations/*" = ["RUF012", "D"]
"*/urls.py" = ["D"]
"tests/*" = ["S101", "D"]
"testproj/*" = ["D"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"asyncio.TaskGroup".msg = "Use asyncio_extensions.TaskGroup instead."

[tool.ruff.lint.pydocstyle]
convention = "pep257"
ignore-decorators = ["typing.overload"]
